# Builds the "USB 显示器" app (monitor module) and publishes the APK.
# Branch pushes update the "monitor-latest" release (overwritten every time).
# A tag "usb-display-vX.Y" creates a permanent release "USB 显示器 vX.Y" with the
# APK and the unstripped native libraries (native-symbols.zip) of that version.
name: USB 显示器 APK

on:
  push:
    paths-ignore:
      - '**.md'
      - 'images/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # the default also installs the obsolete "tools" package, which no longer exists
          packages: 'platform-tools'

      - name: Install NDK, CMake and platform
        run: sdkmanager --install "ndk;28.1.13356709" "cmake;3.22.1" "platforms;android-36" "build-tools;35.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :monitor:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp monitor/build/outputs/apk/release/monitor-release.apk out/USB-Display.apk
          ls -l out

      # unstripped native libraries, to turn "libuvc.so pc 0x..." of a crash report into source lines
      - name: Collect native symbols
        run: |
          mkdir -p out/symbols
          find libuvc/build/intermediates -path '*/obj/local/*' -name '*.so' | while read -r f; do
            abi=$(basename "$(dirname "$f")")
            mkdir -p "out/symbols/$abi"
            cp "$f" "out/symbols/$abi/"
          done
          (cd out && zip -qr native-symbols.zip symbols)
          ls -l out out/symbols/*

      - uses: actions/upload-artifact@v4
        with:
          name: USB-Display-apk
          path: out/USB-Display.apk

      - uses: actions/upload-artifact@v4
        with:
          name: native-symbols
          path: out/native-symbols.zip

      - name: Publish to the monitor-latest release
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="USB 显示器 最新构建：第 ${GITHUB_RUN_NUMBER} 次构建，分支 ${GITHUB_REF_NAME}，提交 ${GITHUB_SHA::7}。
          用手机浏览器打开本页，下载 USB-Display.apk 安装即可。"
          if ! gh release view monitor-latest > /dev/null 2>&1; then
            gh release create monitor-latest --prerelease --target "$GITHUB_SHA" \
              --title "USB 显示器（最新版）" --notes "$NOTES"
          else
            gh release edit monitor-latest --notes "$NOTES"
          fi
          gh release upload monitor-latest out/USB-Display.apk --clobber

      - name: Publish the version release
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'usb-display-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#usb-display-v}"
          cp out/USB-Display.apk "out/USB-Display-v${VERSION}.apk"
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "USB 显示器 v${VERSION}" --notes-file monitor/CHANGELOG.md
          fi
          gh release upload "$GITHUB_REF_NAME" "out/USB-Display-v${VERSION}.apk" out/native-symbols.zip --clobber
